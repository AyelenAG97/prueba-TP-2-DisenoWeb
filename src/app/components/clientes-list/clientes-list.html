<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Teléfono</th>
            <th>Bidones</th>
            <th>Día de Reparto</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let cliente of clienteList" (click)="view(see, cliente)">
            <td>{{ cliente.id }}</td>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.apellido }}</td>
            <td>{{ cliente.direccion }}</td>
            <td>{{ cliente.telefono }}</td>
            <td>{{ cliente.bidones }}</td>
            <td>{{ cliente.diaReparto }}</td>
        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td></td>
            <td><input #nombreInput class="form-control" [(ngModel)]="nombre" placeholder="Nombre"></td>
            <td><input class="form-control" [(ngModel)]="apellido" placeholder="Apellido"></td>
            <td><input class="form-control" [(ngModel)]="direccion" placeholder="Dirección"></td>
            <td><input class="form-control" [(ngModel)]="telefono" placeholder="Teléfono"></td>
            <td><input class="form-control" type="number" min="1" [(ngModel)]="bidones" placeholder="Bidones"></td>
            <td>
                <select class="form-select" [(ngModel)]="diaReparto">
                    <option value="">Día...</option>
                    <option *ngFor="let dia of dias" [value]="dia">{{ dia }}</option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="7" style="text-align: center"><button class="btn btn-primary" (click)="add()">AGREGAR</button></td>
        </tr>
    </tfoot>
</table>

<ng-template #see let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Datos del Cliente</h5>
        <button class="close ms-auto" aria-label="Close" (click)="modal.dismiss()"><span aria-hidden="true">&times;</span></button>
    </div>
    <div class="modal-body">
        <label>ID:</label>
        <input class="form-control" [(ngModel)]="id2" disabled>
        <label>NOMBRE:</label>
        <input class="form-control" [(ngModel)]="nombre2">
        <label>APELLIDO:</label>
        <input class="form-control" [(ngModel)]="apellido2">
        <label>DIRECCIÓN:</label>
        <input class="form-control" [(ngModel)]="direccion2">
        <label>TELÉFONO:</label>
        <input class="form-control" [(ngModel)]="telefono2">
        <label>BIDONES:</label>
        <input class="form-control" type="number" min="1" [(ngModel)]="bidones2">
        <label>DÍA DE REPARTO:</label>
        <select class="form-select" [(ngModel)]="diaReparto2">
            <option *ngFor="let dia of dias" [value]="dia">{{ dia }}</option>
        </select>
    </div>
    <div class="modal-footer">
        <button class="btn btn-danger" (click)="modal.close('delete')">BORRAR</button>
        <button class="btn btn-primary" (click)="modal.close('update')">ACTUALIZAR</button>
    </div>
</ng-template>
